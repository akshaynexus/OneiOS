# Do the Adreno-generic metal2vulkan patches of userland/metal/patches/metal2vulkan apply to the pin of
# scripts/setup/get-references.sh, and does the crate still type-check with them? Public sources only, no Apple files.
# Manual run; on a failure the log is the artifact (send it back).
name: gpu-patch-check
on:
  workflow_dispatch:
  pull_request:
    paths: ["userland/metal/patches/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin
        id: pin
        run: |
          set -euo pipefail
          pin=$(awk '$1=="metal2vulkan" {print $3}' scripts/setup/get-references.sh)
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Restore executable bits (an upload drops them)
        # git grep -z: macOS's grep has no -Z, so the old ls-files|xargs grep pipeline handed chmod one
        # newline-joined name and the step failed on every runner.
        run: git grep -zIl -e '^#!' | xargs -0 -r chmod +x
      - name: metal2vulkan at the pin
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/steelbrain/metal2vulkan.git m2v
          git -C m2v checkout -q ${{ steps.pin.outputs.pin }}
      - name: Apply
        run: |
          set -euo pipefail
          cd m2v
          git config user.email ci@example.invalid; git config user.name ci
          for p in ../userland/metal/patches/metal2vulkan/*.patch; do echo "== $p"; git apply --check "$p"; git apply "$p"; done 2>&1 | tee ../apply.log
      - name: cargo check (host)
        run: |
          set -euo pipefail
          cd m2v
          cargo check -p metal2vulkan -p metal2vulkan-runtime 2>&1 | tee ../cargo.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gpu-patch-check-logs
          path: |
            apply.log
            cargo.log
