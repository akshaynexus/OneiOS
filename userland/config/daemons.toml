  "com.apple.analyticsagent", "com.apple.ap.adprivacyd", "com.apple.ap.promotedcontentd",
  "com.apple.appstorecomponentsd", "com.apple.askpermissiond", "com.apple.assistant_cdmd",
  "com.apple.assistant_service", "com.apple.assistantd", "com.apple.audioanalyticsd",
