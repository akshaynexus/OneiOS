default = true
source = "vphone-cli 2.14.2 GuestServiceProfile.swift base27 (list version 3): measured on an iPhone guest, iOS 27.0 24A435; memory -29 %, idle CPU -26 %, idle writes -60 %, no feature of the guest lost. Less generativeexperiencesd (kept) and the OTA jobs (under replace)"
