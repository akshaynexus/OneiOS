[group.extra]
default = true
source = "vphone-android android/vphone-native/src/services.rs TRIMMED_EXTRA: momentsd used 0.67 of a guest CPU at rest in the 0.6.0 log; coreduetd, modelcatalogd and mstreamd are UniXNU-sheng's BootWatchdogPolicy labels from iPadOS 27.0.1 (coreduetd held half a core through the boot)"
labels = ["com.apple.momentsd", "com.apple.coreduetd", "com.apple.modelcatalogd", "com.apple.mediastream.mstreamd"]

[group.signin]
default = true
source = "vphone-cli signin_followup: the Apple Account follow-up prompts; a guest whose Setup was skipped has none to show"
labels = ["com.apple.appleidsetupd", "com.apple.followupd"]

[group.hardware]
default = true
source = "hardware this host has no stand-in for. aned: iOSPlus10 ios26-root-spec.py DROP_N104 ('no Neural Engine on this SoC'; read on 26.5.2, label [U] on 27.0.1). The NFC, Secure Element and UWB jobs are in base already"
labels = ["com.apple.aned", "com.apple.fairplayd.H2"]
# fairplayd.H2 (the iPhone's; the iPad's is fairplayd.A2): UniXNU-droidvm package/DroidVMBootArgs27.c disables it on
# iPadOS 27.0.1: without the FairPlayIOKit kext, which the kernel collection does not carry, it exits but its Mach
# services stay registered, and lockdownd, accountsd and the apps behind them hang; on iOS 16 iOSPlus10 saw locationd
# deadlock the same way. Costs: App Store apps do not start. The other three of UniXNU's iPad list are covered:
# watchdogd (replace), identityservicesd and accessoryupdaterd (base). Its fourth, CommCenter, is kept here: see [idle].

[group.store]
default = false
source = "vphone-cli app_store: off with the store apps. Off by default here: App Store installs are a goal (plan M6)"
labels = ["com.apple.appstored", "com.apple.itunesstored"]

[group.fewest]
default = false
source = "vphone-android services.rs FEWEST_EXTRA: each costs a feature (AirDrop, widgets, FairPlay, erase, hang reports, push) and none was run on iOS 27"
labels = [
  "com.apple.sharingd", "com.apple.chronod", "com.apple.mobile.obliteration",
  "com.apple.spindump", "com.apple.tailspind", "com.apple.aggregated", "com.apple.activityawardsd", "com.apple.apsd",
]

[group.bringup-26]
default = false
source = "iOSPlus10 scripts/laurel/ios26-root-spec.py DROP_LOAD_LOOPS and DROP_LOAD_HOT, less what keep holds: jobs that looped or ran hot on a 26.5.2 root with no SEP, NFC or watch. For a first boot that shows a crash loop; labels [U] on 27.0.1"
labels = [
  "com.apple.deviceaccessd", "com.apple.gamepolicyd", "com.apple.driverkitd", "com.apple.factory.NFQRCoded",
  "com.apple.biometrickitd.pearl", "com.apple.cloudpaird", "com.apple.sirittsd", "com.apple.PerfPowerServices",
  "com.apple.biomed",
]
