  "com.apple.findmy.findmybeaconingd", "com.apple.findmy.findmylocated", "com.apple.finhealthd",
  "com.apple.fitnesscoachingd", "com.apple.fitnessintelligenced", "com.apple.gamed", "com.apple.geoanalyticsd",
