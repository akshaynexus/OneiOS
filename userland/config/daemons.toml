  "com.apple.carkitd", "com.apple.cdpd", "com.apple.cloudtelemetryd", "com.apple.cmfsyncagent", "com.apple.coreidvd",
  "com.apple.corespeechd", "com.apple.diagnosticextensionsd", "com.apple.diagnosticspushd", "com.apple.duetexpertd",
