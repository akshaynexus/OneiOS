# iOS 27 launchd jobs on the OneiOS host (Galaxy S24 Ultra, XNU as a process): keep, idle, replace or disable.
#
#   keep     must run; never disabled, whatever a group below names
#   idle     runs with nothing to drive: its hardware is absent and it must come to rest, not crash-loop
#   replace  disabled in the guest because the host or a OneiOS helper does its job
#   disable  not needed here; disabled in groups, each with where its list was measured
#
# A group is applied when it is `default = true` or named with --group; --keep LABEL takes one label out.
# A label the root's launchd cache does not have is reported and not written.
#
# Where a list was measured matters: only vphone's is from iOS 27 on an iPhone identity. The iPad lists
# (UniXNU) and the iOS 16/26 lists (iOSPlus10) are named as such and are off unless stated.

# ---- keep -------------------------------------------------------------------------------------------------
[keep]
# vphone-cli 2.14.2 VPhoneDaemon/Daemon/GuestServiceProfile.swift `neverDisable`, measured on an iPhone
# guest of iOS 27.0 (Research/Guest/service_trimming.md "Never disabled").
labels = [
  # the boot chain to the home screen
  "com.apple.SpringBoard", "com.apple.backboardd", "com.apple.runningboardd",
  "com.apple.lsd", "com.apple.lsd.system",
  "com.apple.containermanagerd", "com.apple.containermanagerd.system",
  "com.apple.cfprefsd.xpc.daemon", "com.apple.cfprefsd.xpc.daemon.system",
  "com.apple.notifyd", "com.apple.configd", "com.apple.powerd", "com.apple.securityd",
  "com.apple.MobileFileIntegrity", "com.apple.mobile.keybagd", "com.apple.mobileactivationd",
  "com.apple.logd", "com.apple.logd_helper", "com.apple.diagnosticd",
  "com.apple.timed", "com.apple.tzlinkd",
  "com.apple.mDNSResponder.reloaded", "com.apple.mDNSResponderHelper.reloaded",
  "com.apple.managedconfiguration.profiled", "com.apple.security.cryptexd",
  # worse when off (each measured)
  "com.apple.sleepd",
  "com.apple.CommCenter", "com.apple.CommCenterMobileHelper", "com.apple.CommCenterRootHelper",
  "com.apple.cloudd",
  "com.apple.nanoregistryd", "com.apple.nanoregistrylaunchd",
  "com.apple.siriactionsd", "com.apple.passd", "com.apple.financed",
  "com.apple.generativeexperiencesd",
  # apps, installs, debugging
  "com.apple.mobile.installd", "com.apple.misagent", "com.apple.mobile.lockdown", "com.apple.remoted",
  "com.apple.dt.remotepairingdeviced", "com.apple.diskimagesiod", "com.apple.diskimagesiod.ram",
  "com.apple.mobileassetd", "com.apple.storekitd", "com.apple.pasteboard.pasted",
  "com.apple.ReportCrash", "com.apple.osanalytics.osanalyticshelper",
  # the CoreAnalytics server: its clients retry a synchronous send when it is missing
  "com.apple.analyticsd",
  # media and location paths other daemons call synchronously
  "com.apple.locationd", "com.apple.bluetoothd",
  "com.apple.audiomxd", "com.apple.mediaplaybackd", "com.apple.mediaremoted", "com.apple.cameracaptured",
  "com.apple.avconferenced",
]

[keep.reasons]
"com.apple.sleepd" = "without it SpringBoard and mobiletimerd reconnect with no back-off: 5000 log lines in 3 s, launchd 115 s of CPU in two minutes (vphone, iOS 27.0)"
"com.apple.CommCenter" = "without it SpringBoard's SBTelephonyManager reconnects every second and resets the idle timer (vphone, iOS 27.0). See [idle]"
"com.apple.cloudd" = "without it transparencyd and ScreenTimeSettingsAgent retry CloudKit and write more than an untrimmed guest (vphone)"
"com.apple.nanoregistryd" = "locationd waits on it synchronously (vphone)"
"com.apple.siriactionsd" = "every Control Center control and App Intents widget serializes its intent through it; without it the controls draw blank (vphone, list version 2)"
"com.apple.passd" = "Wallet's first screen waits on it, and it on financed (vphone, list version 3)"
"com.apple.generativeexperiencesd" = "in vphone-cli's list, but vphone-android keeps it: without it an idle iOS 27 guest spins launchd (android/vphone-native/src/services.rs KEEP)"
"com.apple.bluetoothd" = "locationd calls it synchronously (vphone). iOSPlus10 dropped it on iOS 16 for a relaunch loop; on iOS 27 it stays and idles"
"com.apple.analyticsd" = "without it backboardd spun at 217% CPU after a brightness change: CoreAnalytics::Client::retryXpcMessageHelper_sync makes a new connection for each retry of a synchronous send (__kernelrpc_mach_port_construct_trap in a loop) and the brightness never reached the panel (phone, 2026-11-12, oneios-ubt). vphone's base27 disables it; here the lookups found no service and the clients spun"
"com.apple.security.cryptexd" = "needs /chosen/manifest-properties in the device tree, or it restarts every 10 s (iOSPlus10 notes 5167-5175)"

# ---- idle -------------------------------------------------------------------------------------------------
# Kept running; what each needs from the kernel or the device tree to rest instead of crash-looping.
[idle]
"com.apple.CommCenter" = "the two references disagree. UniXNU-droidvm disables it on the (Wi-Fi) iPad: it 'waits for hardware there is none of'. vphone keeps it on the iPhone: without it SpringBoard loops. Kept, as the iPhone measurement says; if it crash-loops on the first boot, --disable com.apple.CommCenter and its two helpers. Needs no `baseband` node in the device tree: its job has _LimitLoadToDeviceTree baseband and CommCenter-noncellular _LimitLoadFromDeviceTree baseband (iOSPlus10 cellular.md 40-62, read on 26.5.2; [U] on 27.0.1). vphone's guest runs it with no modem. No calls, SMS or cellular data"
"com.apple.CommCenterMobileHelper" = "follows CommCenter"
"com.apple.CommCenterRootHelper" = "follows CommCenter"
"com.apple.bluetoothd" = "no controller. Kept: with it disabled audiomxd's BTAudioHALPlugin looked its service up 1900 times a second and launchd used 90 % of a CPU (UniXNU-droidvm DroidVMBootArgs27.c); locationd calls it too. The device tree gives it /bluetooth transport-encoding 10 (the virtual transport)"
"com.apple.cameracaptured" = "no camera sensors published: Camera opens to a black preview. Kept: other media daemons wait on it"
"com.apple.locationd" = "no GPS; 27.0's locationd also hangs or crashes with EXC_ARM_PAC_FAIL on vphone's guest (service_trimming.md). Location Services stay off. Its crash loop here (pc 0 from _dispatch_lane_serial_drain, 17 times a session) is CoreLocation's automatic cohort queues: CLAutoCohort is off on the Data volume (roottweak feature-flags, hosted 0048)"
"com.apple.mobile.keybagd" = "no SEP: answered by the kernel's key-store stand-in (UniXNU AppleKeyStoreState); a keybag load failure is a reboot loop (iOSPlus10 notes 2747-2777)"
"com.apple.biometrickitd" = "no Face ID sensor: its IOKit match never comes, it waits. Not disabled: Settings and SpringBoard ask it whether biometrics exist"
"com.apple.thermalmonitord" = "no Apple thermal sensors: reports nominal. Kept (iOSPlus10 KEEP_FOR_PARITY)"
"com.apple.wifid" = "no Apple Wi-Fi chip: the guest's network is the host's interface (HostNet); wifid sees no device"
"com.apple.audiomxd" = "sound goes to the host driver (HostAudio); without it there is no route and it idles"

# ---- replace ----------------------------------------------------------------------------------------------
# Disabled in the guest; the right column is who does the job instead.
[replace]
default = true
[replace.labels]
"com.apple.watchdogd" = "no watchdog timer device here (UniXNU docs/guide/skip-setup.md: 'watchdogd has no watchdog backend'). The host's switch has its own dead-man timer (oneos/interface.md section 5)"
"com.apple.mobile.softwareupdated" = "updates are a new image set built by image-build; an OTA would write a root the host cannot boot"
"com.apple.softwareupdateservicesd" = "as softwareupdated"
"com.apple.OTATaskingAgent" = "as softwareupdated"
"com.apple.OTACrashCopier" = "as softwareupdated"

# ---- disable groups ---------------------------------------------------------------------------------------
