# The guest OneiOS presents: iPhone18,2 on iOS 27.0.1. Read by roottweak; the booter builds the device tree
# from the [adt] tables through the boot contract (docs/userland.md, "Boot contract").
#
# Marks: [F] taken from a source named beside it, [I] inferred, [U] unknown. "DT" is the IPSW's own device tree
# for v54ap (24A446), read on the build machine from out/kernel-inputs/24A446/devicetree.bin (image-build's
# scripts/image/kernel-inputs.sh); only the few values below are written down here.

[device]
product = "iPhone18,2"        # [F] owner's target
board = "v54ap"               # [F] vphone-android android/create/installer/src/cfw.rs IPHONES table
target_type = "V54"           # [F] DT / target-type
chip_id = 0x8150              # [F] profiles/ios-27.0.1-iPhone18,2.toml (BuildManifest, T8150)
board_id = 0x0E               # [F] the same
device_class = "iPhone"
os = "iOS"
version = "27.0.1"
# The jetsam properties launchd reads follow target-type: com.apple.jetsamproperties.<target_type>.plist
# [F] vphone-cli Research/Guest/service_trimming.md "iOS 27 and DisableAllowed".

[display]
# The iPhone 17 Pro Max's own panel, portrait. [F] DT /product: artwork-device-subtype 2868, artwork-scale-factor 3,
# artwork-device-idiom phone; width and ppi are the model's public figures [I].
# SpringBoard picks its layout by the point size and the artwork subtype, so the guest keeps the iPhone's
# metrics and the host scales the picture to its panel (1440x3120: the same shape within 0.3 %).
width = 1320
height = 2868
scale = 3
points = [440, 956]
ppi = 460
orientation = "portrait"
refresh_hz = 120

[adt.root]
# UniXNU profiles/os/ipados-27.0.1-24A446/profile.toml sets these three for the iPad; these are the iPhone's.
model = "iPhone18,2"
"target-type" = "V54"
compatible = ["V54AP", "iPhone18,2", "AppleARM"]   # [F] DT; UniXNU puts the board first and its own platform name after

[adt.chosen]
# [F] the same values UniXNU's iPad profile and ios-sweet's mkadt set: with this tuple mobileactivationd
# reports the device activated, and AMFI takes platform code from the trust caches only.
osenvironment = "main"
"crypto-hash-method" = "sha2-384"
"security-domain" = 1
"certificate-production-status" = 0
"effective-production-status-ap" = 0
"certificate-security-mode" = 1
"effective-security-mode-sep" = 1
"amfi-only-platform-code" = 1
"display-scale" = 3

[adt.product]
# [F] UniXNU docs/guide/mobilegestalt.md: the idiom MobileGestalt answers; "phone" for an iPhone. The rest of
# /product is copied from the IPSW's own DeviceTree for v54ap (UniXNU-droidvm make-droidvm-adt.py --identity-tree),
# less: name, AAPL,phandle, exclaves-enabled, has-exclaves, artwork-display-gamut; and graphics-featureset-fallbacks
# without APPLE2 and MTL2,2 (with them SplashBoard writes snapshots only Apple's GPU decodes: blank switcher cards).
"artwork-device-idiom" = "phone"
"artwork-scale-factor" = 3
"artwork-device-subtype" = 2868
"artwork-display-gamut" = "sRGB"      # DT has P3; UniXNU-droidvm gives its display sRGB (--display-gamut), as the host layer does

[adt.buttons]
# [F] make-droidvm-adt.py: with home-button-type 2 the lock screen opens by a swipe up, as on this iPhone.
"button-names" = ["volup", "voldown", "hold"]   # DT also has "ringeren" (the Action button): no host key for it
"home-button-type" = 2

[adt.required]
"arm-io/wlan" = "a node named wlan (device_type wlan): launchd loads wifid only where it exists and MobileGestalt answers wifi from it (make-droidvm-adt.py 589-593)"
"bluetooth" = "transport-encoding 10 (the virtual transport) and local-mac-address (make-droidvm-adt.py 559-560)"
"defaults/vmm-present" = "1, as UniXNU: MobileGestalt IsVirtualDevice. Not hidden from SpringBoard, whose backlight state machine otherwise waits on panel hardware until its watchdog kills it (DroidVMBootArgs27.c 28-34)"
# Properties the booter must give a value; without them the guest stalls or crashes.
# [F] iOSPlus10 scripts/laurel/mkadt.py, external/slop/tools/mkadt.py, docs/notes.md 127-130, 5167-5175.
"chosen/unique-chip-id" = "a stable 64-bit number per install: without it there is no IOPlatformUUID, ByHost preferences fail and data migration runs at every boot"
"chosen/mac-address-wifi0" = "6 bytes: without the three addresses MobileGestalt waits 5 s per answer and lsd, backboardd and SpringBoard stall for minutes"
"chosen/mac-address-bluetooth0" = "6 bytes"
"chosen/mac-address-ethernet0" = "6 bytes"
"chosen/manifest-properties" = "present (may be empty): cryptexd panics in libimage4 without it"
"chosen/manifest-object-properties" = "present (may be empty)"
"chosen/board-id" = "0x0E (device.board_id)"
"chosen/chip-id" = "0x8150 (device.chip_id)"

[adt.absent]
# Nodes that must not be in the tree: their daemons load by them (_LimitLoadToDeviceTree).
baseband = "DT has it (compatible baseband,n41). No modem: with the node CommCenter starts the baseband path and aborts (iOSPlus10 docs/laurel_sprout/cellular.md 40-62)"
# [F] read in /sbin/mount, /sbin/fsck, apfs_boot_util, libsystem_info and the APFS kext of 24A446, and booted both ways
# on 2026-11-11 (docs/userland.md section 10). Apple's node says "the System, Preboot, xART, Data, Update, Hardware and
# Baseband volumes are in the container the root is in" and os_env_type 1 says "this is the main OS". Here each image
# is its own container and the kernel has mounted everything before launchd.
"filesystems/fstab" = "DT has it (os_env_type 1, seven volumes by APFS role). With it, fsck runs fsck_apfs on the OS container and `mount -P 2` looks for a Data-role volume in the root's container, finds none, exits 66 and the kernel panics (launchd's boot task mount-phase-2 must succeed). Without it both take their 'not the main OS' path, the APFS kext logs one line (DT_get_fstab_entries: failed to get filesystem entry at: /filesystems/fstab) per mount phase, and nothing is left to mount"

[mobilegestalt.expect]
# What oneios-mg checks in the running guest (helpers/oneios-mg.c). All come from the device tree.
ProductType = "iPhone18,2"
DeviceClass = "iPhone"
DeviceClassNumber = "1"
"main-screen-width" = "1320"
"main-screen-height" = "2868"
"main-screen-scale" = "3"
ArtworkDeviceSubType = "2868"
