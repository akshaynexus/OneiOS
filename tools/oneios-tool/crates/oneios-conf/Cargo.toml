[package]
name = "oneios-conf"
version.workspace = true
edition.workspace = true
license.workspace = true

# `oneios-tool switches` (xnuhost's switch catalog as JSON) and `oneios-tool conf` (an image's xnuhost.conf: show,
# check, set, unset, write, restore), for the OneOS app's Switches screen (README "switches" and "conf"). The catalog
# is runtime/switches (oneios-switches), the list xnuhost's own switches line is made from.
[dependencies]
clap.workspace = true
libc.workspace = true
oneios-common.workspace = true
oneios-switches.workspace = true
