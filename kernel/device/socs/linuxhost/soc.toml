schema_version = 2

# The "SoC" of a OneiOS guest: no hardware of its own. XNU runs as a process on One UI's Linux kernel; the CPU is the
# phone's (Cortex-X4/A720/A520, ARMv9.2-A, PAC), and memory, interrupts, time and devices come from xnuhost
# (runtime/xnuhost): today by trapping the kernel's privileged instructions and device accesses (the board is the
# DroidVM-shaped one of runtime/loader), later through the host calls of runtime/xnuhost/include/xnuhost/hostcall.h.
[soc]
name = "linuxhost"
description = "XNU as a process on a Linux kernel (xnuhost)"

[components]
include = ["ArmCpu", "ArmDTPlatform"]
