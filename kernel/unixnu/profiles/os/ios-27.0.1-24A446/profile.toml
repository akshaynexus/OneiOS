# UniXNU OS profile of OneiOS: iOS 27.0.1 (24A446), iPhone18,2 (iPhone 17 Pro Max, V54AP, T8150), arm64e.
# Copied into the UniXNU checkout (profiles/os/) by kernel/lib/stage.sh. Made from UniXNU's
# profiles/os/ipados-27.0.1-24A446/profile.toml; what differs, and what is still to pin, is in
# kernel/profiles/iphone18-2-ios27.md. The IPSW values are those of profiles/ios-27.0.1-iPhone18,2.toml (image-build).
[os]
name = "ios-27.0.1-24A446"
arch = "arm64e"
darwin = "25.5.0"
# As the iPadOS profile: no Darwin 26 XNU source is published; 24A446 runs on xnu-12377 with the Darwin 26 system
# calls added (patches/xnu/series).
xnu_version = "12377.121.6"
xnu_revision = "ac9718fb1af618d5ce8678d0dc6e8a58f252216f"
driverkit_tag = "xnu-12377.121.6"
trustcache_tag = "xnu-8796.101.5"
ios_version = "27.0"
abi = []

[ipsw]
url = "https://updates.cdn-apple.com/2026FallFCS/3b7299da-a6a5-4bf6-82db-cd37f8c2d160/iPhone18,2_27.0.1_24A446_Restore.ipsw"
product = "iPhone18,2"
version = "27.0.1"
build = "24A446"
device_class = "v54ap"
chip_id = 33104     # 0x8150
board_id = 14       # 0x0E
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
slide = "-0x1000000"
# TO PIN from kernelcache.release.v54 of the owner's IPSW (kernel/profiles/iphone18-2-ios27.md, "Kernelcache pins"):
#   kernelcache_sha256, early_security_init (the AMFI wrapper's address), regression_policy, abi/original-classes.json.
# Until they are here the prelink step refuses this profile; the native kernel (--skip-prelink) needs none of them.
extra_args = ["--fileset-reference", "build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf", "--allow-missing"]
# The iPadOS profile's roots, without the two iPad-only audio/video families checked against the iPhone kernelcache yet.
roots = ["com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer", "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController", "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.driver.ApplePMGR", "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily", "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily", "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily", "com.apple.iokit.IOSurface", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust", "com.apple.security.AppleImage4", "com.apple.security.sandbox", "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOHIDEventDriver"]

[adt.root.string]
model = "iPhone18,2"
target-type = "V54"
compatible = "V54AP"

[adt.chosen.string]
osenvironment = "main"
crypto-hash-method = "sha2-384"

[adt.chosen.u32]
board-id = 14
security-domain = 1
certificate-production-status = 0
effective-production-status-ap = 0
certificate-security-mode = 1
effective-security-mode-sep = 1
amfi-only-platform-code = 1

# Apple sources of the macOS 26.5 release that pairs with xnu-12377.121.6 (as the iPadOS profile).
[[source]]
name = "IOStorageFamily"
kind = "refer"
git = "https://github.com/apple-oss-distributions/IOStorageFamily.git"
ref = "IOStorageFamily-337.100.1"
commit = "7edb88fbae296fb7c8ce2f64e115e116e566d51c"

[[source]]
name = "IOHIDFamily"
kind = "refer"
git = "https://github.com/apple-oss-distributions/IOHIDFamily.git"
ref = "IOHIDFamily-2238.120.5"
commit = "e31e90a24c27ad6cbe981650d12a1a4124065b03"

[[source]]
name = "libplatform"
kind = "refer"
git = "https://github.com/apple-oss-distributions/libplatform.git"
ref = "libplatform-375.120.2"
commit = "b7ed7cf5cf7dd12b98672435db2225a860f199d8"

[[source]]
name = "libdispatch"
kind = "refer"
git = "https://github.com/apple-oss-distributions/libdispatch.git"
ref = "libdispatch-1542.100.32"
commit = "701f4d1a24ae9c6863901bbbb22624b7d1b87321"

[[source]]
name = "AvailabilityVersions"
kind = "refer"
git = "https://github.com/apple-oss-distributions/AvailabilityVersions.git"
ref = "AvailabilityVersions-157.2"
commit = "149b1777f3e8c2133042d8e188f72e3adf6a7110"

[[source]]
name = "libpthread"
kind = "refer"
git = "https://github.com/apple-oss-distributions/libpthread.git"
ref = "libpthread-539.100.4"
commit = "1f4f5265b319111142f1bf3a27d4484ef5a98314"

[userdata]
windows = [{ name = "OS", component = "OS" }, { name = "SystemOS", component = "Cryptex1,SystemOS", optional = true }]

# [root] (APFS volume UUIDs and image digests of the OS and SystemOS images) is written by the image build, which
# has the images; the kernel build does not read it.
