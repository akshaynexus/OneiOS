# --- the image set (out/image/24A446/) ----------------------------------------------------------------------

[image]
format = 1
id = "ios-27.0.1-24A446-iPhone18-2"
# where the OneOS fork unpacks the set on the phone (oneos/interface.md, section 3)
stage = "/data/local/tmp/oneios/image"
archive = "OneiOS_iOS27.0.1_24A446_iPhone18-2.tar.zst"
# bytes per entry of an image's hash list (NAME.hashes)
chunk = 1048576
seed = "data.seed"
# the kernel collection the kernel build makes (out/kernel/24A446/kernel.kc); it holds Apple's kexts, so it
# travels in the image set and not in the runtime package
kernel = "kernel.kc"

[image.files]
os = "os.img"
systemos = "systemos.img"
app = "app.img"
trust-static = "trust/static.trustcache"
trust-system = "trust/system.trustcache"
trust-app = "trust/app.trustcache"
roothash-os = "trust/os.root_hash"
roothash-system = "trust/system.root_hash"
roothash-app = "trust/app.root_hash"

[data]
# The Data volume the guest makes from the seed on its first start. The kernel mounts Data by this UUID.
volume_uuid = "1B7DB2B7-5ECA-4FDA-98AF-55DF8632E355"
volume_name = "Data"
# size of the sparse Data store the runtime creates beside the image, in GiB
store_gib = 16
# the folder of the OS volume the seed starts from
source = "private/var"
# time of every seed file the build adds or rewrites: the build's release time (2026-09-28T18:54:15Z)
epoch = 1790621655
