# OneiOS build profile: iOS 27.0.1 (24A446) for iPhone18,2 (iPhone 17 Pro Max, V54AP, T8150).
#
# What scripts/fetch/fetch.sh takes from Apple's restore file and what scripts/image/build.sh makes of it.
# Every pin below was read on 2026-11-10 from Apple's own data, without downloading the restore file:
#   - the IPSW's URL, size and SHA-256: https://api.ipsw.me/v4/device/iPhone18,2?type=ipsw
#   - member names, sizes and CRC-32: the IPSW's ZIP directory (scripts/fetch/fetch.sh --list PROFILE)
#   - component -> member, and sha384: BuildManifest.plist, identity "Customer Erase Install (IPSW)" of v54ap.
#     For a member that is not AEA, the BuildManifest digest is the SHA-384 of the file as shipped.
# Format of this file: docs/image-format.md, "Profile".
schema = 1

[os]
name = "ios-27.0.1-24A446-iPhone18,2"
version = "27.0.1"
build = "24A446"
device = "iPhone18,2"
board = "v54ap"
platform = "t8150"
chip_id = 0x8150
board_id = 0x0E
arch = "arm64e"

[ipsw]
url = "https://updates.cdn-apple.com/2026FallFCS/3b7299da-a6a5-4bf6-82db-cd37f8c2d160/iPhone18,2_27.0.1_24A446_Restore.ipsw"
size = 12708916186
# of the whole file (ipsw.me). The fetch never has the whole file, so it cannot check this one; it checks the members.
sha256 = "b1535ded2e84bf1d7c716372e498bd10720b2b47374e7e1b4f885a6075b921eb"
metadata = "https://api.ipsw.me/v4/device/iPhone18,2?type=ipsw"
variant = "Customer Erase Install (IPSW)"
# free space the fetch wants in inputs/: both AEA files (10.6 GiB) next to their decrypted images (15.4 GiB)
need_gib = 30

