# OneiOS build profile: iOS 27.2.1 (24B156) for iPhone18,2 (iPhone 17 Pro Max, V54AP, T8150).
#
# What scripts/fetch/fetch.sh takes from Apple's restore file and what scripts/image/build.sh makes of it.
# Every pin below was read on 2026-11-20 from Apple's own data, without downloading the restore file:
#   - the IPSW's URL, size and SHA-256: https://api.ipsw.me/v4/device/iPhone18,2?type=ipsw
#   - member names, sizes and CRC-32: the IPSW's ZIP directory (oneios-tool remotezip ls URL)
#   - component -> member, and sha384: BuildManifest.plist, identity "Customer Erase Install (IPSW)" of v54ap
#     (oneios-tool remotezip cat URL BuildManifest.plist).
# Format of this file: docs/image-format.md, "Profile".
schema = 1

[os]
name = "ios-27.2.1-24B156-iPhone18,2"
version = "27.2.1"
build = "24B156"
device = "iPhone18,2"
board = "v54ap"
platform = "t8150"
chip_id = 0x8150
board_id = 0x0E
arch = "arm64e"

[ipsw]
url = "https://updates.cdn-apple.com/2026FallFCS/5cf23110-0e1e-4f62-aef3-746ff41c71f4/iPhone18,2_27.2.1_24B156_Restore.ipsw"
size = 13155803124
# of the whole file (ipsw.me). The fetch never has the whole file, so it cannot check this one; it checks the members.
sha256 = "de0ea895d8217813dea878a8a57603036721f5fbb5ac4868a8363632da634ce2"
metadata = "https://api.ipsw.me/v4/device/iPhone18,2?type=ipsw"
variant = "Customer Erase Install (IPSW)"
# free space the fetch wants in inputs/: both AEA files (10.9 GiB) next to their decrypted images (16.7 GiB)
need_gib = 32

