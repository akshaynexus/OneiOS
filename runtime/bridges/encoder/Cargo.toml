[package]
name = "oneencoder"
description = "The video encoder bridge: the droidvm,virtio-media device and its backends"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false
build = "build.rs"

[lib]
path = "lib.rs"

# bin/oneios-encoder of the runtime package: the helper process (dynamic on Android: build.rs; on a host the
# stand-in only).
[[bin]]
name = "oneios-encoder"
path = "bin/oneios-encoder.rs"

# bin/encctl: the phone test, the whole path in one process (dynamic on Android; on a host with the stand-in).
[[bin]]
name = "encctl"
path = "bin/encctl.rs"

# The stand-in encoder alone, its streams through ffmpeg when there is one (tests/decode.sh; the C's test_standin.c).
[[test]]
name = "standin"
path = "tests/standin.rs"

# The virtio-media device over xh-core's transport, through the helper process and in-process (the C's test_encoder.c).
[[test]]
name = "encoder"
path = "tests/encoder.rs"

# A helper that hangs in its open: killed within the limit, a new one, no more after two (the C's test_hung_helper).
# A binary of its own: it sets the stand-in's hang switch in this process's environment, which its helpers inherit.
[[test]]
name = "hung_helper"
path = "tests/hung_helper.rs"

# The decoder (2026-11-24): the device decoding through the helper process and in-process, with the stand-in decoder.
[[test]]
name = "decoder"
path = "tests/decoder.rs"

# The device's interrupt as the staged DroidVMVirtioMedia.c (edit 7, 2026-11-25) takes it: the command queue raises
# nothing, the event queue raises the SPI, oneios-codec-irq=0 keeps it down. A binary of its own: the SPI recorder is per
# process and every encctl Guest is on SPI 40.
[[test]]
name = "interrupt"
path = "tests/interrupt.rs"

# The worker waits for an encoder's units (2026-11-25): its wake-ups over a 2 s stream through a backend that wakes it,
# one that cannot (the old 1 ms looks), and the helper process.
[[test]]
name = "wakes"
path = "tests/wakes.rs"

# MediaCodec's numbers and AMediaCodecBufferInfo's layout against the NDK's headers.
[[test]]
name = "headers"
path = "tests/headers.rs"

[dependencies]
libc.workspace = true
xh-core.workspace = true
# The helper spawn (posix_spawn with the socket as descriptor 3) and the wire helpers are the camera's.
onecamera.workspace = true

[lints]
workspace = true
